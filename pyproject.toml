[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "options-mm"
version = "1.0.0"
description = "Options market making with Black-Scholes fair values, inventory-aware quoting and delta hedging across two listings, with a simulated exchange."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Amirmahdi Shokatabadi"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9", "matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
